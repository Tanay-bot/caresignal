<style>
:root{

  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
#viewport{position:fixed;inset:0;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);
  color:var(--ink);font-family:var(--ui);font-size:24px;overflow:hidden}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.hdr{position:absolute;left:70px;right:70px;top:34px;display:flex;justify-content:space-between;align-items:baseline}
.act{font-size:40px;font-weight:800;letter-spacing:.01em}
.act .num{color:var(--ink2);font-weight:700;margin-right:14px}
.meta{font-size:24px;color:var(--ink2);font-weight:600;text-align:right}
.sub{position:absolute;left:70px;width:1230px;top:96px;font-size:22px;line-height:31px;color:var(--ink2)}
.sub b{color:var(--ink)}
.ctx{position:absolute;left:100px;right:100px;top:104px;font-size:26px;color:var(--ink2)}
.ctx b{color:var(--ink)}
.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;overflow:visible}
#nText{position:absolute;left:100px;top:178px;width:1720px;font-family:var(--serif);line-height:2.05;color:var(--ink);
  user-select:text;z-index:2}
#nText .missingText{font-family:var(--ui);font-size:32px;border:3px dashed var(--line);padding:30px}
#nFront{z-index:3}
#nLegend{position:absolute;left:100px;width:1720px;top:650px;z-index:2}
.lrow{display:grid;grid-template-columns:100px 250px 270px 1fr;align-items:center;column-gap:18px;min-height:62px;

.lrow:last-of-type{border-bottom:2px solid #2b3240}
.lrow .role{font-weight:800;font-size:26px}
.lrow .lab{font-weight:800;font-size:26px;letter-spacing:.02em}
.lrow .desc{color:var(--ink2)}
.lrow .desc b{color:var(--ink)}
.verdict{display:inline-block;font-weight:800;font-size:22px;padding:2px 10px;border:2px solid var(--ink);border-radius:4px;margin-left:10px}
.verdict.no{border-style:dashed}
.rationale{margin-top:18px;font-size:22px;line-height:32px;color:var(--ink2)}
.rationale b{color:var(--ink)}
.chip{display:inline-block;font-size:22px;font-weight:800;padding:1px 10px;border:2px solid var(--model);color:var(--model);border-radius:4px;letter-spacing:.03em;vertical-align:middle}

.ctitle{font-size:24px;font-weight:800;letter-spacing:.05em;margin-bottom:6px}

.crow{position:relative;margin-top:12px}
.cline{display:flex;justify-content:space-between;align-items:flex-end;min-height:56px;column-gap:8px}
.cname{font-size:23px;font-weight:700;line-height:28px;flex:1 1 auto;min-width:0}

.odo{height:56px;overflow:hidden;user-select:none;text-align:right;flex:0 0 250px}
.odocol{will-change:transform}
.odocol div{height:56px;line-height:56px;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.odocol div span{font-size:26px;font-weight:700;color:var(--ink2);margin-left:10px}
.barwrap{position:relative;height:28px;margin-top:6px;background:#0f1219;border:2px solid var(--line);box-sizing:content-box;width:500px}
.bar{position:absolute;left:0;top:0;height:28px;width:500px;transform-origin:0 50%;will-change:transform}
.bar.base{background:var(--base)}
.bar.model{background:var(--model)}
.bar.model.replay{background:repeating-linear-gradient(135deg,var(--model) 0 11px,#0d2c52 11px 18px)}
.ghost{position:absolute;top:-6px;height:36px;border:3px dashed var(--ink);border-left:none;box-sizing:border-box;left:0}
.ccap{font-size:22px;line-height:28px;margin-top:8px;color:var(--ink)}
.ccap b{color:var(--model)}
.tick{position:absolute;width:4px;background:var(--ink);top:0;bottom:0;z-index:2}
.ticklab{position:absolute;font-size:22px;font-weight:700;white-space:nowrap;transform:translateX(-50%);top:-2px}
#swing{margin-top:6px;font-size:22px;line-height:29px;border-left:5px solid var(--ink);padding-left:16px}
#swing .big{display:block;font-size:32px;line-height:40px;font-weight:800}
#swing b{color:var(--ink)}
footer{position:absolute;left:70px;right:70px;bottom:22px;display:flex;justify-content:space-between;font-size:22px;color:var(--ink2);z-index:5}
footer b{color:var(--ink)}
.overlay{position:absolute;inset:0;background:rgba(6,8,12,.94);display:none;z-index:20}
.overlay.on{display:block}
.panel{position:absolute;left:220px;right:220px;top:110px;bottom:110px;border:3px solid var(--ink);background:var(--panel);padding:44px 56px;box-sizing:border-box}
.panel h2{margin:0 0 26px;font-size:42px}
.keys{display:grid;grid-template-columns:260px 1fr;row-gap:12px;font-size:26px}
.keys .k{font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace}
.limits h2{font-size:46px;margin:0 0 10px}
.limits .lede{font-size:26px;color:var(--ink2);margin-bottom:22px}
.limits ol{margin:0;padding-left:0;list-style:none}
.limits li{display:grid;grid-template-columns:420px 1fr;column-gap:30px;padding:16px 0;border-top:2px solid #39414f;font-size:25px;line-height:35px}
.limits li b{font-size:30px}
#endScene .limits{position:absolute;left:100px;right:100px;top:70px}
#toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#000;font-size:24px;font-weight:800;
  padding:10px 22px;border-radius:6px;opacity:0;z-index:30;white-space:nowrap}
.banner{position:absolute;left:70px;right:70px;bottom:66px;border:3px dashed var(--ink);padding:14px 20px;font-size:24px;z-index:4;background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  const gold = drawSpans("gold", note.gold.spans, back, front);
  const base = drawSpans("base", note.pred.baseline && note.pred.baseline.spans, back, front);
  const model = drawSpans("model", note.pred[mkey(v)] && note.pred[mkey(v)].spans, back, front);
  if (mode === "type") {
    const t = actOneTiming(P, note);
    [[gold.g, rows.gold], [base.g, rows.base], [model.g, rows.model]].forEach(([g, row], i) => {
      anim(g, [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: P.markerDur, delay: t.markers[i] });
      anim(row, [{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "none" }], { duration: P.markerDur, delay: t.markers[i] });
    });
    if (rows.extra) anim(rows.extra, [{ opacity: 0 }, { opacity: 1 }], { duration: P.markerDur, delay: t.markers[2] });
  } else if (mode === "swing") {
    const from = v === 2 ? 1 : 2;
    const prev = note.pred[mkey(from)];
    const old = drawSpans("model", prev && prev.spans, back, front);
    old.g.style.opacity = "0";
    const a = old.anchor || legendAnchor(rows.model), b = model.anchor || legendAnchor(rows.model);
    const dur = 1200;
    anim(old.g, [{ opacity: 1 }, { opacity: 0 }], { duration: 350, delay: 0 });
    anim(model.g, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: dur - 150 });
    anim(rows.model, [{ opacity: 0.25 }, { opacity: 1 }], { duration: 400, delay: dur - 150 });
    if (spanKey(prev ? prev.spans : []) !== spanKey(note.pred[mkey(v)] ? note.pred[mkey(v)].spans : [])) puck(front, a, b, 0, dur, -Math.max(120, Math.abs(b.y - a.y) * 0.6), true);
  }
}

/* A blue puck that travels a cubic bezier using transform keyframes only. */
function bez(p0, c1, c2, p1, t) {
  const u = 1 - t;
  return { x: u*u*u*p0.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*p1.x, y: u*u*u*p0.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*p1.y };
}
function puck(layer, a, b, delay, dur, lift, vertical) {
  // vertical=true: arc lifts in y (note text). false: arc bulges in x (columns).
  const c1 = vertical ? { x: a.x, y: Math.min(a.y, b.y) + lift } : { x: a.x + lift, y: a.y };
  const c2 = vertical ? { x: b.x, y: Math.min(a.y, b.y) + lift } : { x: b.x + lift, y: b.y };
  const trail = s("path", { d: `M${a.x},${a.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${b.x},${b.y}`, fill: "none", stroke: "#4ea8ff", "stroke-width": 3, "stroke-dasharray": "6 6", opacity: 0.85 }, layer);
  const p = s("g", null, layer);
  s("circle", { cx: 0, cy: 0, r: 11, fill: "#4ea8ff", stroke: "#ffffff", "stroke-width": 3 }, p);
  p.style.opacity = "0";
  p.style.transform = `translate(${b.x}px, ${b.y}px)`;
  const frames = [];
  for (let i = 0; i <= 24; i++) {
    const q = bez(a, c1, c2, b, i / 24);
    frames.push({ offset: i / 24, transform: `translate(${q.x}px, ${q.y}px)`, opacity: i === 0 || i === 24 ? 0 : 1 });
  }
  frames[1].opacity = 1;
  anim(p, frames, { duration: dur, delay, easing: EASE_IO });
  anim(trail, [{ opacity: 0 }, { opacity: 0.85 }], { duration: dur * 0.6, delay });
  return p;
}

/* =========================================================== BOARD SCENE */
const G = { x0: 70, x1: 1290, colTop: 168, colH: 300, slotY: 494, idxY: 548, ribC: 748, cellH: 210 };
function pitch() { return (G.x1 - G.x0) / Math.max(N, 1); }
function cw() { return Math.min(pitch() - 6, 84); }
function colX(i) { return G.x0 + i * pitch() + (pitch() - cw()) / 2; }
const maxLen = Math.max(1, ...NOTES.map((n) => (n.text ? Array.from(n.text).length : 0)));
function colLen(n) { return n.text ? Array.from(n.text).length : 0; }
function cy(n, c) { return G.colTop + (G.colH * c) / maxLen; }
function setMid(n, spans) {
  const r = resolved(spans || []);
  if (!r.length) return G.slotY;
  const lo = Math.min(...r.map((x) => x.start)), hi = Math.max(...r.map((x) => x.end));
  return (cy(n, lo) + cy(n, hi)) / 2;
}
function cellXform(i, st) { return `translate(${colX(i)}px, ${G.ribC - G.cellH / 2 + STATES[st].dy}px)`; }
function makeCell(i, st, layer) {
  const g = s("g", { class: "cell" }, layer), M = STATES[st], w = cw();
  g.style.transform = cellXform(i, st);
  s("rect", { x: 0, y: 0, width: w, height: G.cellH, rx: 5, fill: M.fill, stroke: M.stroke || "none", "stroke-width": M.stroke ? 3 : 0, "stroke-dasharray": M.dash || "none" }, g);
  s("text", { transform: `translate(${w / 2} ${G.cellH / 2}) rotate(-90)`, "text-anchor": "middle", "dominant-baseline": "central",
    "font-size": 22, "font-weight": 800, fill: M.ink, "letter-spacing": "0.04em" }, g, M.word);
  s("title", null, g, `Note ${i + 1} ${NOTES[i].id}: ${M.word}`);
  return g;
}
function modelBars(i, v, layer) {
  const n = NOTES[i], p = n.pred[mkey(v)], g = s("g", { class: "mbars" }, layer), w = cw(), x = colX(i);
  if (!p || !n.text) return g;
  resolved(p.spans).forEach((sp) => s("rect", { x: x + w / 2 + 2, y: cy(n, sp.start), width: w / 2 - 6, height: Math.max(4, cy(n, sp.end) - cy(n, sp.start)), fill: v === 2 ? "url(#hatchM)" : "#4ea8ff" }, g));
  if (!p.spans.length) s("text", { x: x + (3 * w) / 4, y: G.slotY, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 22, "font-weight": 800, fill: "#4ea8ff" }, g, "∅");
  return g;
}
function makeColumn(i, v, layer) {
  const n = NOTES[i], g = s("g", { class: "col" }, layer), w = cw(), x = colX(i);
  if (!n.text) {
    s("rect", { x, y: G.colTop, width: w, height: G.colH, fill: "none", stroke: "#ffffff", "stroke-width": 2, "stroke-dasharray": "8 6" }, g);
    s("text", { transform: `translate(${x + w / 2} ${G.colTop + G.colH / 2}) rotate(-90)`, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 22, "font-weight": 800, fill: "#fff" }, g, "NO TEXT");
    return { g, mb: s("g", null, g) };
  }
  const len = colLen(n);
  s("rect", { x, y: G.colTop, width: w, height: cy(n, len) - G.colTop, fill: "#262d3b", stroke: "#8f99ad", "stroke-width": 2 }, g);
  (n.sentences || []).slice(1).forEach((b) => s("rect", { x: x + 2, y: cy(n, b[0]) - 1.5, width: w - 4, height: 3, fill: "#0b0d12" }, g));
  const bp = n.pred.baseline;
  if (bp) resolved(bp.spans).forEach((sp) => s("rect", { x: x + 4, y: cy(n, sp.start), width: w / 2 - 6, height: Math.max(4, cy(n, sp.end) - cy(n, sp.start)), fill: "#ff9f1c" }, g));
  resolved(n.gold.spans).forEach((sp) => s("rect", { x: x + 1.5, y: cy(n, sp.start), width: w - 3, height: Math.max(4, cy(n, sp.end) - cy(n, sp.start)), fill: "none", stroke: "#ffffff", "stroke-width": 3 }, g));
  const unresolvedAny = [n.gold.spans, bp && bp.spans, n.pred.v1 && n.pred.v1.spans, n.pred.v2 && n.pred.v2.spans].some((sp) => sp && sp.some((x) => x.start == null));
  if (unresolvedAny) s("text", { x: x + w / 4, y: G.slotY, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 22, "font-weight": 800, fill: "#fff" }, g, "?");
  const mb = modelBars(i, v, g);
  return { g, mb };
}

function buildCounters(v) {
  const C = $("counters"); C.textContent = "";
  const swingBox = h("div", { id: "swing" });
  const refs = {};
  [["label", "LABEL ACCURACY", ""], ["joint", "JOINT ACCURACY", " · label + exact span"]].forEach(([metric, title, sub]) => {
    const grp = h("div", { class: "cgroup" }, C);
    h("div", { class: "ctitle" }, grp).innerHTML = `${title}<span>${sub}</span>`;
    refs[metric] = {};
    [["baseline", "BASELINE", "phrase rules"], ["model", modelName(v), "gemini-3.1-flash-lite"]].forEach(([who, name, small]) => {
      const sys = who === "baseline" ? "baseline" : mkey(v);
      const sc = score(sys, metric);
      const row = h("div", { class: "crow" }, grp);
      const line = h("div", { class: "cline" }, row);
      h("div", { class: "cname" }, line).innerHTML = `${name}<small>${v === 2 && who === "model" ? `<span class="chip">POST-HOC REPLAY</span>` : small}</small>`;
      const odo = h("div", { class: "odo", "aria-hidden": "true" }, line);
      const col = h("div", { class: "odocol" }, odo);
      const t = sc.t || N;
      for (let k = 0; k <= t; k++) h("div", null, col).innerHTML = `${k}/${t}<span>${pct(k, t)}%</span>`;
      const wrap = h("div", { class: "barwrap" }, row);
      const bar = h("div", { class: "bar " + (who === "baseline" ? "base" : "model" + (v === 2 ? " replay" : "")) }, wrap);
      const ref = { col, bar, t, k: sc.k, sys };
      col.style.transform = `translateY(${-sc.k * 56}px)`;
      bar.style.transform = `scaleX(${t ? sc.k / t : 0})`;
      h("span", { class: "sr" }, row, `${name}: ${sc.k} of ${t}, ${pct(sc.k, t)} percent${v === 2 && who === "model" ? ", post-hoc replay on the same held-out set, not a held-out estimate" : ""}`);
      if (who === "model" && v === 2) {
        const v1 = score("v1", metric);
        const gh = h("div", { class: "ghost" }, wrap);
        gh.style.width = (500 * v1.k) / (v1.t || N) + "px";
        ref.ghost = gh;
        const cap = h("div", { class: "ccap" }, row);
        cap.innerHTML = metric === "label"
          ? `<b>${pct(sc.k, t)}%</b> is a <b>post-hoc replay on the same held-out set</b>, not a held-out estimate. Dashed = prompt v1 held-out run (${v1.k}/${v1.t}).`
          : `Post-hoc replay · dashed = prompt v1 (${v1.k}/${v1.t}).`;
        ref.cap = cap;
      }
      refs[metric][who] = ref;
    });
    if (metric === "label" && D.always_unclear_label_correct != null) {
      const k = D.always_unclear_label_correct;
      const rows = grp.querySelectorAll(".barwrap");
      const x = (500 * k) / N + 2;
      rows.forEach((bw) => { const tk = h("div", { class: "tick" }, bw); tk.style.left = x - 2 + "px"; });
      const lab = h("div", { class: "ticklab" }, grp, `always UNCLEAR: ${k}/${N}`);
      lab.style.left = x + "px"; lab.style.top = "-30px";
      refs.tick = lab;
    }
  });
  C.appendChild(swingBox);
  return refs;
}
/* Counter keyframes that step as each cell lands: value_i after event i. */
function counterFrames(ref, events, from, total) {
  const f = [{ offset: 0, v: from }];
  let cur = from;
  events.forEach(([t, d]) => { if (!d) return; f.push({ offset: Math.min(1, Math.max(0, (t - 260) / total)), v: cur }); cur += d; f.push({ offset: Math.min(1, t / total), v: cur }); });
  if (cur !== ref.k) console.warn(`[divergence] counter ${ref.sys}: per-note path ends at ${cur}, stored ${ref.k}; final frame uses stored value`);
  f.push({ offset: 1, v: ref.k });
  for (let i = 1; i < f.length; i++) if (f[i].offset < f[i - 1].offset) f[i].offset = f[i - 1].offset;
  anim(ref.col, f.map((x) => ({ offset: x.offset, transform: `translateY(${-x.v * 56}px)` })), { duration: total, delay: 0, easing: "linear" });
  anim(ref.bar, f.map((x) => ({ offset: x.offset, transform: `scaleX(${ref.t ? x.v / ref.t : 0})` })), { duration: total, delay: 0, easing: "linear" });
}

function boardText(v) {

  const ch = STATS.baselineChanged == null ? "baseline not replayed" : `baseline: <b>${STATS.baselineChanged} of ${N}</b> changed`;

    : `One cell per note. A cell <b>rises</b> when only the baseline was right and <b>drops</b> when only the model was right.` +

/* mode: null instant · "race" Act II · "swing" Act III (from the other prompt) */
function renderBoard(v, mode, P) {
  const cols = $("gCols"), idx = $("gIdx"), rib = $("gRib"), arcs = $("gArcs");

  const cells = NOTES.map((n, i) => makeCell(i, cellState(n, v, S.basis), rib));

    s("rect", { x: 1.5, y: 1.5, width: cw() - 3, height: G.cellH - 3, rx: 5, fill: "none", stroke: "#ffffff", "stroke-width": 3, "stroke-dasharray": "9 7" }, g);

  });

    const land = (i) => P.ribbonLead + i * step + P.cellDur;

      const st = cellState(NOTES[i], v, S.basis), d = P.ribbonLead + i * step;

               { opacity: 1, transform: cellXform(i, st) }], { duration: P.cellDur, delay: d });

    });

    }));
  } else if (mode === "swing") {

    const step = stagger(P.swingTotal, P.swingLead, P.arcDur, N);
    const land = (i) => P.swingLead + i * step + P.arcDur;
    NOTES.forEach((n, i) => {
      const t0 = P.swingLead + i * step;
      const oldSt = cellState(n, from, S.basis), newSt = cellState(n, v, S.basis);
      if (oldSt !== newSt) {
        const old = makeCell(i, oldSt, rib); old.style.opacity = "0";
        anim(old, [{ opacity: 1 }, { opacity: 0, transform: cellXform(i, newSt) }], { duration: P.arcDur * 0.45, delay: t0 + P.arcDur * 0.55 });
        anim(cells[i], [{ opacity: 0, transform: cellXform(i, oldSt) }, { opacity: 1, transform: cellXform(i, newSt) }], { duration: P.arcDur * 0.45, delay: t0 + P.arcDur * 0.55 });
        if (ghostEls[i]) anim(ghostEls[i], [{ opacity: 0 }, { opacity: 1 }], { duration: P.arcDur * 0.4, delay: t0 + P.arcDur * 0.8 });
      }

        anim(colRefs[i].mb, [{ opacity: 0 }, { opacity: 1 }], { duration: P.arcDur * 0.3, delay: t0 + P.arcDur * 0.75 });

      const r = refs[metric].model, prevK = score(mkey(from), metric).k;

      if (r.ghost) anim(r.ghost, [{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 0 });
      if (r.cap) anim(r.cap, [{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 0 });
    });
    anim($("swing"), [{ opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: P.swingTotal - 700 });
  }
}

/* ============================================================ LIMITATIONS */
function limitsHTML() {

/* ================================================================== STATE */
const S = { mode: "seq", step: 0, note: ACT1, v: 1, basis: "label", profile: "standard", autoplay: false, digit: null, digitTimer: null, autoTimer: null };
const P = () => PROFILES[S.profile];

function enter(step, mode) {

  const g = gen;
  if (step === 0) {
    if (DEGRADED) { S.step = 1; return enter(1, mode ? "race" : null); }
    show("noteScene"); S.note = ACT1; renderNote(ACT1, S.v, mode ? "type" : null, P());
  } else if (step === 1 || step === 2) {
    S.v = step === 2 ? 2 : 1;
    show("boardScene"); renderBoard(S.v, mode, P());
  } else {
    show("endScene"); $("endLimits").innerHTML = limitsHTML();
    if (mode) anim($("endLimits"), [{ opacity: 0, transform: "translateY(18px)" }, { opacity: 1, transform: "none" }], { duration: 800 });
  }
  if (mode && running.length) {
    const actName = mode === "swing" ? (step === 2 ? "Act III (swing v1→v2)" : "Act III reversed (swing v2→v1)") : ["Act I", "Act II", "Act III", "Close"][step];
    console.log(`[divergence] ${actName} · ${P().name} · measured from animation timeline: ${(motionEnd() / 1000).toFixed(2)} s`);
  }
  if (S.autoplay) {
    motionDone().then(() => {
      if (g !== gen || !S.autoplay) return;
      if (S.step >= 3) { S.autoplay = false; toast("Autoplay finished"); return; }
      S.autoTimer = setTimeout(() => { if (g === gen && S.autoplay) enter(S.step + 1, S.step === 0 ? "race" : S.step === 1 ? "swing" : "fade"); }, REDUCED ? 1500 : P().holds[S.step]);
    });
  }
}
function inspect(i) {
  stopAll(); gen++; stopAuto();
  if (i < 0 || i >= N) { toast(`No note ${i + 1} — ${N} notes present`); return; }
  S.mode = "inspect"; S.note = i;
  show("noteScene"); renderNote(i, S.v, null, P());
}
function stopAuto() { S.autoplay = false; clearTimeout(S.autoTimer); }
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.opacity = "1";
  clearTimeout(toast.tm); toast.tm = setTimeout(() => (t.style.opacity = "0"), 1600);
}
function ribbonView() {
  stopAuto();
  if (S.mode === "seq" && (S.step === 1 || S.step === 2)) {
    S.basis = S.basis === "label" ? "joint" : "label"; stopAll(); renderBoard(S.v, null, P()); toast(`Ribbon basis: ${S.basis}`);
  } else enter(S.v === 2 ? 2 : 1, null);
}
function next() {
  if (busy()) { finishAll(); return; }
  stopAuto();
  if (S.mode === "inspect") return inspect(Math.min(N - 1, S.note + 1));
  if (S.step >= 3) return;
  enter(S.step + 1, S.step === 0 ? "race" : S.step === 1 ? "swing" : "fade");
}
function back() {
  stopAuto();
  if (S.mode === "inspect") return inspect(Math.max(0, S.note - 1));
  if (S.step > 0) enter(S.step - 1, null);
  else enter(0, null);
}
function toggleV() {
  stopAuto();
  if (S.mode === "seq" && (S.step === 1 || S.step === 2)) { stopAll(); enter(S.step === 1 ? 2 : 1, "swing"); return; }
  S.v = S.v === 2 ? 1 : 2;
  if (S.mode === "inspect" || (S.mode === "seq" && S.step === 0)) { stopAll(); renderNote(S.note, S.v, "swing", P()); }
  toast(S.v === 2 ? "Prompt v2 — post-hoc replay on the same held-out set" : "Prompt v1 — held-out run");
}
function reset(profile, auto) {
  stopAuto(); stopAll();
  Object.assign(S, { v: 1, basis: "label", profile: profile || "standard", autoplay: !!auto });
  $("ovKeys").classList.remove("on"); $("ovLimits").classList.remove("on");
  enter(0, "type");
}
function digit(d) {
  clearTimeout(S.digitTimer);
  if (S.digit != null) {
    const n = S.digit * 10 + d; S.digit = null;
    if (n >= 11 && n <= N) return inspect(n - 1);
  }
  inspect((d === 0 ? 10 : d) - 1);
  if ((d === 1 || d === 2) && N > 10) { S.digit = d; S.digitTimer = setTimeout(() => (S.digit = null), 900); }
}

/* ------------------------------------------------------------- PNG export */
function exportPNG() {
  const clone = $("stage").cloneNode(true);
  clone.style.transform = "none"; clone.style.left = "0px"; clone.style.top = "0px";
  clone.querySelector("#toast").style.opacity = "0";
  const css = document.querySelector("style").textContent.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const body = new XMLSerializer().serializeToString(clone);
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><foreignObject x="0" y="0" width="1920" height="1080">` +
    `<div xmlns="http://www.w3.org/1999/xhtml" style="width:1920px;height:1080px;position:relative"><style>${css}</style>${body}</div></foreignObject></svg>`;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = 1920; c.height = 1080;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#0b0d12"; ctx.fillRect(0, 0, 1920, 1080); ctx.drawImage(img, 0, 0);
    c.toBlob((blob) => {
      if (!blob) { toast("PNG export failed"); return; }
      const a = document.createElement("a");
      const where = S.mode === "inspect" ? `note-${S.note + 1}` : `act-${["1", "2", "3", "close"][S.step]}`;
      a.download = `divergence-${where}-v${S.v}-${S.basis}.png`;
      a.href = URL.createObjectURL(blob); document.body.appendChild(a); a.click(); a.remove();
      toast("Saved " + a.download);
    }, "image/png");
  };
  img.onerror = () => toast("PNG export failed");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);
}

/* ------------------------------------------------------------------- keys */
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === "Digit3" && e.shiftKey) { e.preventDefault(); reset("preset3", true); toast("3-minute preset · autoplay"); return; }
  const k = e.key;
  if (k === " " || k === "ArrowRight") { e.preventDefault(); next(); }
  else if (k === "ArrowLeft") { e.preventDefault(); back(); }
  else if (/^[0-9]$/.test(k)) digit(Number(k));
  else if (k === "a") {
    if (S.autoplay) { stopAuto(); toast("Autoplay off"); return; }
    S.profile = "standard";
    if (S.mode !== "seq" || S.step >= 3) reset("standard", true);
    else { S.autoplay = true; enter(S.step, S.step === 0 ? "type" : S.step === 1 ? "race" : "swing"); }
    toast("Autoplay · full-length");
  }
  else if (k === "v") toggleV();
  else if (k === "d") ribbonView();
  else if (k === "Escape") { if ($("ovKeys").classList.contains("on") || $("ovLimits").classList.contains("on")) { $("ovKeys").classList.remove("on"); $("ovLimits").classList.remove("on"); } else if (S.mode === "inspect") ribbonView(); }
  else if (k === "l") { $("limitsPanel").innerHTML = limitsHTML(); $("ovKeys").classList.remove("on"); $("ovLimits").classList.toggle("on"); }
  else if (k === "?" || k === "/") { $("keysPanel").innerHTML = keysHTML(); $("ovLimits").classList.remove("on"); $("ovKeys").classList.toggle("on"); }
  else if (k === "s") exportPNG();
  else if (k === "r") reset("standard", false);
});
window.addEventListener("resize", () => {
  fit();
  if (busy()) return;
  if (S.mode === "inspect" || S.step === 0) renderNote(S.note, S.v, null, P());
});

/* ------------------------------------------------------------------- boot */
function logTimings() {
  const note = NOTES[ACT1];
  const rows = Object.values(PROFILES).map((Pr) => {
    const a1 = DEGRADED ? 0 : actOneTiming(Pr, note).total, a2 = Pr.ribbonTotal, a3 = Pr.swingTotal, close = 800;
    const motion = a1 + a2 + a3 + close, holds = Pr.holds.reduce((x, y) => x + y, 0);
    return { profile: Pr.name, "Act I typing s": (actOneTiming(Pr, note).T / 1000).toFixed(2), "Act I s": (a1 / 1000).toFixed(2),
      "Act II s": (a2 / 1000).toFixed(2), "Act III s": (a3 / 1000).toFixed(2), "close card s": (close / 1000).toFixed(2),
      "motion total s": (motion / 1000).toFixed(2), "holds s": (holds / 1000).toFixed(2), "autoplay total s": ((motion + holds) / 1000).toFixed(2),
      "motion < 100 s": motion < 100000 };
  });
  console.log(`[divergence] Act durations (computed from the same schedule the animations use; Act I note ${note ? note.id : "none"}, ${note && note.text ? Array.from(note.text).length : 0} chars)${REDUCED ? " — prefers-reduced-motion is ON: motion is cut to end states" : ""}`);
  console.table(rows);
  rows.forEach((r) => console.log(`[divergence] ${r.profile}: Act I ${r["Act I s"]} s (typing ${r["Act I typing s"]} s) · Act II ${r["Act II s"]} s · Act III ${r["Act III s"]} s · close ${r["close card s"]} s · motion ${r["motion total s"]} s · with holds ${r["autoplay total s"]} s`));
}
fit();
if (!D) {
  document.body.innerHTML = '<p style="font:28px system-ui;color:#fff;padding:60px">No data inlined. Run <code>python scripts/export_divergence.py</code>.</p>';
} else {
  $("fSrc").innerHTML = `saved results only · freeze <b>${escapeHTML(String(D.provenance.freeze_commit || "").slice(0, 7))}</b> · no model calls`;
  logTimings();
  enter(0, "type");
}
</script>
</body>
