<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<title>Divergence</title>
<style>
:root{
  --bg:#07090d; --panel:#121722; --ink:#f6f4ef; --ink2:#cdd3de; --line:#8f99ad;
  --gold:#ffffff; --base:#ff9f1c; --model:#4ea8ff; --both:#dfe3ea;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",Times,serif;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
#viewport{position:fixed;inset:0;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:var(--ink);font-family:var(--ui);font-size:24px;overflow:hidden;
  background:radial-gradient(1400px 800px at 50% 38%,#141a27 0%,#0b0e15 55%,#07090d 100%)}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.hdr{position:absolute;left:70px;right:70px;top:30px;display:flex;justify-content:space-between;align-items:baseline;z-index:6}
.act{font-size:40px;font-weight:850;letter-spacing:.01em}
.act .num{color:var(--ink2);font-weight:700;margin-right:14px}
.meta{font-size:22px;color:var(--ink2);font-weight:600;text-align:right;line-height:30px}
.meta b{color:var(--ink)}
.sub{position:absolute;left:70px;right:70px;top:92px;font-size:22px;line-height:30px;color:var(--ink2);z-index:6}
.sub b{color:var(--ink)}
.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;overflow:visible}

/* ---------- title */
#tWord{position:absolute;left:0;right:0;top:330px;text-align:center;font-size:200px;font-weight:900;letter-spacing:.06em;line-height:1}
#tWord span{display:inline-block}
#tWord .b{color:var(--base)} #tWord .m{color:var(--model)}
#tRule{position:absolute;left:460px;width:1000px;top:572px;height:8px;background:linear-gradient(90deg,var(--base) 0 50%,var(--model) 50% 100%);transform-origin:50% 50%}
#tSub{position:absolute;left:0;right:0;top:620px;text-align:center;font-size:36px;font-weight:600}
#tSub2{position:absolute;left:0;right:0;top:684px;text-align:center;font-size:26px;color:var(--ink2)}

/* ---------- demo (3D) */
#d3{position:absolute;inset:0;perspective:1700px;perspective-origin:50% 42%}
#dWorld{position:absolute;inset:0;transform-style:preserve-3d}
.card3{position:absolute;background:#f6f4ef;color:#0b0d12;border-radius:14px;box-shadow:0 40px 80px rgba(0,0,0,.55);transform-style:preserve-3d;backface-visibility:hidden}
.card3 .tag{font-family:var(--ui);font-size:22px;font-weight:800;letter-spacing:.06em;color:#3a4252}
#dNote{left:110px;top:200px;width:780px;height:420px;padding:34px 40px;box-sizing:border-box}
#dNote .body,#dNote .hl{position:absolute;left:40px;right:40px;top:96px;font-family:var(--serif);font-size:40px;line-height:62px}
#dNote .hl{color:transparent}
#dNote .hl mark{background:#ffd84d;color:#0b0d12;border-radius:4px;padding:0 2px}
#dEv{left:990px;top:150px;width:820px;padding:30px 36px;box-sizing:border-box;background:#ffffff;border:5px solid #ffd84d}
#dEv .q{font-family:var(--serif);font-size:38px;line-height:54px;margin-top:10px}
#dEv .foot{font-size:22px;color:#3a4252;margin-top:12px}
#dLab{left:990px;top:470px;width:820px;padding:20px 36px;box-sizing:border-box;background:#0b0d12;color:#fff;border:4px solid #fff}
#dLab .tag{color:#cdd3de}
#dLab .v{font-size:44px;font-weight:850;margin-top:4px}
.res{top:640px;width:820px;min-height:150px;padding:18px 28px;box-sizing:border-box;background:#121722;color:#fff;border:3px solid #8f99ad;display:grid;grid-template-columns:1fr auto;column-gap:22px;transform-style:flat!important;backface-visibility:visible!important}
#dR0{left:110px} #dR1{left:990px}
.res .nm{font-size:36px;font-weight:850}
.res .us{font-size:22px;line-height:30px;color:var(--ink2);margin-top:4px}
.res .out{align-self:center;justify-self:end;font-size:32px;font-weight:900;padding:12px 18px;border-radius:8px;background:#fff;color:#0b0d12;white-space:nowrap}
.res .out.more{background:#ffd84d}
#dCaps{position:absolute;left:110px;right:110px;top:878px;height:80px}
.cap{position:absolute;left:0;right:0;top:0;font-size:34px;font-weight:700;line-height:44px}
.cap .n{display:inline-block;min-width:54px;height:44px;line-height:44px;text-align:center;border-radius:22px;background:var(--ink);color:#000;font-weight:900;margin-right:16px;font-size:26px;vertical-align:top}
.cap small{display:block;font-size:24px;font-weight:500;color:var(--ink2);margin-left:70px}
#dWarn{position:absolute;right:70px;top:40px;font-size:22px;color:var(--ink2);text-align:right}

/* ---------- note */
#nText{position:absolute;left:100px;top:170px;width:1720px;font-family:var(--serif);line-height:2.05;color:var(--ink);user-select:text;z-index:2}
#nText .seg{transition:none}
#nText .missingText{font-family:var(--ui);font-size:32px;border:3px dashed var(--line);padding:30px}
#nFront{z-index:3}
.ctx{position:absolute;left:100px;right:100px;top:96px;font-size:24px;color:var(--ink2);z-index:4}
.ctx b{color:var(--ink)}
#nCards{position:absolute;left:100px;width:1720px;top:600px;display:grid;grid-template-columns:repeat(3,1fr);column-gap:36px;z-index:2}
.vcard{border:4px solid var(--ink);border-radius:12px;padding:16px 22px 18px;background:rgba(18,23,34,.92);min-height:178px;box-sizing:border-box}
.vcard.base{border-color:var(--base)} .vcard.model{border-color:var(--model)}
.vcard .role{font-size:22px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:12px}
.vcard .lab{font-size:42px;font-weight:900;margin:6px 0 4px;letter-spacing:.01em}
.vcard .desc{font-size:22px;line-height:30px;color:var(--ink2)}
.vcard .desc b{color:var(--ink)}
.verdict{display:inline-block;font-weight:900;font-size:22px;padding:2px 10px;border:3px solid var(--ink);border-radius:5px;margin:8px 8px 0 0}
.verdict.no{border-style:dashed}
#nRat{position:absolute;left:100px;width:1720px;top:820px;font-size:22px;line-height:31px;color:var(--ink2);z-index:2}
#nRat b{color:var(--ink)}
#grid{position:absolute;inset:0;perspective:1400px;z-index:8;pointer-events:none}
#gridPlane{position:absolute;left:260px;top:220px;width:1400px;height:560px;transform-style:preserve-3d}
.gcard{position:absolute;width:150px;height:150px;border-radius:10px;background:#f6f4ef;color:#0b0d12;font-size:22px;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;box-sizing:border-box}
.gcard.hot{background:#ffd84d}
#gridCap{position:absolute;left:0;right:0;top:850px;text-align:center;font-size:34px;font-weight:700;z-index:9}

/* ---------- board */
#race,#swingSB{position:absolute;left:70px;width:1780px;top:132px;height:440px;z-index:4}
.blk{position:absolute;top:0}
.blk.r{right:0;text-align:right}
.bname{font-size:30px;font-weight:850;letter-spacing:.03em}
.bname small{font-size:22px;font-weight:600;color:var(--ink2);margin-left:10px;letter-spacing:0}
.odo{overflow:hidden;user-select:none;position:relative}
.odocol{will-change:transform}
.odocol div{white-space:nowrap;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.odocol div span{font-weight:750;color:var(--ink2);margin-left:14px}
.flash{position:absolute;width:520px;height:260px;top:-40px;border-radius:50%;pointer-events:none;opacity:0}
.mtitle{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:24px;font-weight:850;letter-spacing:.12em}
.lane{position:absolute;left:0;width:1780px;height:30px;border:2px solid var(--line);background:#0c1018;box-sizing:border-box}
.lane .fill{position:absolute;left:0;top:0;bottom:0;width:1776px;transform-origin:0 50%;will-change:transform}
.lane .head{position:absolute;top:-13px;left:-26px;width:52px;height:52px;border-radius:50%;will-change:transform}
.lane .lname{position:absolute;left:0;top:-34px;font-size:22px;font-weight:850;letter-spacing:.06em}
.finish{position:absolute;width:0;border-left:4px dashed var(--ink);z-index:3}
.finlab{position:absolute;font-size:22px;font-weight:800;white-space:nowrap;transform:translateX(-50%)}
.jrow{position:absolute;left:0;right:0;top:390px;display:flex;gap:40px;align-items:center;font-size:22px;font-weight:800;letter-spacing:.06em}
.jrow .odo{height:44px}
.jrow .odocol div{height:44px;line-height:44px;font-size:36px}
.jrow .odocol div span{font-size:24px}
.stamp.inline{position:relative;display:inline-block}
.stamp{position:absolute;border:5px solid var(--model);color:var(--model);background:rgba(7,9,13,.92);padding:2px 16px 4px;border-radius:8px;text-align:center;z-index:5;white-space:nowrap}
.stamp .s1{font-size:34px;font-weight:950;letter-spacing:.08em}
.stamp .s2{font-size:22px;font-weight:800;color:var(--ink)}
.changed{position:absolute;left:470px;width:500px;top:0;text-align:center}
.changed .k{font-size:22px;font-weight:850;letter-spacing:.1em}
.changed .odocol div{height:110px;line-height:110px;font-size:100px}
.changed .odocol div span{font-size:40px}
.changed .w{font-size:24px;color:var(--ink2)}
.was{font-size:22px;color:var(--ink2);margin-top:6px}
.was b{color:var(--ink)}
.banner{position:absolute;left:70px;right:70px;bottom:66px;border:3px dashed var(--ink);padding:8px 18px;font-size:22px;z-index:7;background:var(--bg)}

/* ---------- verdict + overlays */
#vWrap{position:absolute;left:110px;right:110px;top:80px}
#vWrap h2{font-size:64px;margin:0 0 6px;font-weight:900}
#vWrap .lede{font-size:26px;color:var(--ink2);margin-bottom:18px}
.vline{display:grid;grid-template-columns:330px 1fr;column-gap:34px;align-items:center;padding:12px 0;border-top:3px solid #2a3140}
.vline .big{font-size:58px;font-weight:950;letter-spacing:-.01em;line-height:1}
.vline .txt{font-size:25px;line-height:34px}
.vline .txt b{font-size:27px}
#vEnd{margin-top:22px;font-size:34px;font-weight:850;border-left:8px solid var(--ink);padding-left:22px;line-height:44px}
footer{position:absolute;left:70px;right:70px;bottom:20px;display:flex;justify-content:space-between;font-size:22px;color:var(--ink2);z-index:10}
footer b{color:var(--ink)}
.overlay{position:absolute;inset:0;background:rgba(5,7,10,.95);display:none;z-index:20}
.overlay.on{display:block}
.panel{position:absolute;left:200px;right:200px;top:90px;bottom:90px;border:3px solid var(--ink);background:var(--panel);padding:40px 54px;box-sizing:border-box}
.panel h2{margin:0 0 22px;font-size:42px}
.keys{display:grid;grid-template-columns:270px 1fr;row-gap:10px;font-size:25px}
.keys .k{font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace}
.limits li{display:grid;grid-template-columns:420px 1fr;column-gap:30px;padding:14px 0;border-top:2px solid #39414f;font-size:25px;line-height:35px}
.limits ol{margin:0;padding:0;list-style:none}
.limits li b{font-size:29px}
.limits .lede{font-size:25px;color:var(--ink2);margin-bottom:18px}
#toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#000;font-size:24px;font-weight:800;padding:10px 22px;border-radius:6px;opacity:0;z-index:30;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <section id="titleScene" class="scene">
    <div id="tWord" aria-label="Divergence"></div>
    <div id="tRule"></div>
    <div id="tSub"></div>
    <div id="tSub2"></div>
  </section>

  <section id="demoScene" class="scene">
    <div class="hdr"><div class="act"><span class="num">0</span>What CareSignal does</div></div>
    <div id="dWarn"></div>
    <div id="d3"><div id="dWorld">
      <div id="dNote" class="card3"><div class="tag" id="dNoteTag"></div><div class="body" id="dBody"></div><div class="hl" id="dHl" aria-hidden="true"></div></div>
      <div id="dEv" class="card3"><div class="tag">EXACT EVIDENCE · QUOTED, MUST MATCH THE NOTE</div><div class="q" id="dQ"></div><div class="foot">The sentence about help on the selected walk — nothing paraphrased.</div></div>
      <div id="dLab" class="card3"><div class="tag">HELP DOCUMENTED ON THAT WALK</div><div class="v" id="dLv"></div></div>
      <div id="dR0" class="card3 res"></div>
      <div id="dR1" class="card3 res"></div>
    </div></div>
    <div id="dCaps"></div>
  </section>

  <section id="noteScene" class="scene">
    <div class="hdr"><div class="act" id="nAct"></div><div class="meta" id="nMeta"></div></div>
    <div class="ctx" id="nCtx"></div>
    <svg id="nBack" class="ov" viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true"></svg>
    <div id="nText"></div>
    <svg id="nFront" class="ov" viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true"></svg>
    <div id="nCards"></div>
    <div id="nRat"></div>
    <div id="grid"><div id="gridPlane"></div></div>
    <div id="gridCap"></div>
  </section>

  <section id="boardScene" class="scene">
    <div class="hdr"><div class="act" id="bAct"></div><div class="meta" id="bMeta"></div></div>
    <div class="sub" id="bSub"></div>
    <div id="race"></div>
    <div id="swingSB"></div>
    <svg id="board" class="ov" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Divergence ribbon">
      <defs>
        <pattern id="hatchN" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="14" height="14" fill="#161a23"/><rect width="5" height="14" fill="#343c4c"/>
        </pattern>
        <pattern id="hatchM" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="12" height="12" fill="#0d2c52"/><rect width="7" height="12" fill="#4ea8ff"/>
        </pattern>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
      </defs>
      <g id="gFault"></g><g id="gCols"></g><g id="gIdx"></g><g id="gRib"></g><g id="gArcs"></g>
    </svg>
    <div id="flyNote" style="position:absolute;left:100px;top:170px;width:1720px;font-family:var(--serif);font-size:46px;line-height:2.05;transform-origin:0 0;opacity:0;z-index:9;pointer-events:none"></div>
    <div id="bBanner"></div>
  </section>

  <section id="verdictScene" class="scene"><div id="vWrap"></div></section>

  <footer><span id="fKeys"><b>→</b> next · <b>←</b> back · <b>?</b> keys · <b>l</b> limitations</span><span id="fSrc"></span></footer>
  <div id="ovKeys" class="overlay"><div class="panel" id="keysPanel"></div></div>
  <div id="ovLimits" class="overlay"><div class="panel limits" id="limitsPanel"></div></div>
  <div id="toast" role="status"></div>
</div></div>
<script>
"use strict";
const D = /*__DIVERGENCE_DATA__*/null;

/* ------------------------------------------------------------------ setup */
const SVGNS = "http://www.w3.org/2000/svg";
const EASE = "cubic-bezier(0.22, 0.61, 0.36, 1)";
const EASE_IO = "cubic-bezier(0.65, 0, 0.35, 1)";
const EASE_POP = "cubic-bezier(0.2, 1.45, 0.4, 1)";
const EASE_IN = "cubic-bezier(0.55, 0, 0.9, 0.4)";
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
function h(tag, attrs, parent, text) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function s(tag, attrs, parent, text) {
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const escapeHTML = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* Timing profiles. Every animation is scheduled from these numbers only. */
const PROFILES = {
  standard: { key: "standard", name: "full-length (a)",
    title: 2400, demo: 13000,
    dive: 1800, typeMax: 9600, typePerChar: 34, pauseWeight: 8, spot: 300, spotDur: 700, cardsAt: 800, cardGap: 300, cardDur: 500,
    fly: 900, ribbonTotal: 6500, cellDur: 800,
    swingLead: 1400, swingTotal: 9500, arcDur: 1300,
    verdict: 4200,
    holds: [700, 3500, 3000, 4000, 6000] },
  preset3: { key: "preset3", name: "3-minute preset (Shift+3)",
    title: 3000, demo: 18000,
    dive: 2600, typeMax: 22000, typePerChar: 78, pauseWeight: 8, spot: 400, spotDur: 900, cardsAt: 1300, cardGap: 600, cardDur: 700,
    fly: 1400, ribbonTotal: 35000, cellDur: 1200,
    swingLead: 1800, swingTotal: 30000, arcDur: 1800,
    verdict: 6000,
    holds: [800, 5000, 12000, 18000, 18000] },
};

const NOTES = D ? D.notes : [];
const N = NOTES.length;
const SYS = D ? D.systems : {};
const ACT1 = D ? Math.max(0, NOTES.findIndex((n) => n.id === D.act1_note_id)) : 0;
const DEGRADED = !D || D.degraded_ribbon_only;
const STATES = {
  both:    { word: "BOTH RIGHT",    fill: "#dfe3ea", ink: "#0b0d12", dy: 0 },
  base:    { word: "BASELINE ONLY", fill: "#ff9f1c", ink: "#000000", dy: -82, glow: "#ff9f1c" },
  model:   { word: "MODEL ONLY",    fill: "#4ea8ff", ink: "#000000", dy: 82, glow: "#4ea8ff" },
  neither: { word: "NEITHER RIGHT", fill: "url(#hatchN)", ink: "#ffffff", dy: 0, stroke: "#cdd3de" },
  nodata:  { word: "NO DATA",       fill: "#07090d", ink: "#ffffff", dy: 0, stroke: "#ffffff", dash: "8 6" },
};
const LABELS = { UNCLEAR: "UNCLEAR", INDEPENDENT: "INDEPENDENT", SUPERVISION: "SUPERVISION", HANDS_ON: "HANDS-ON", HELP_UNSPECIFIED: "HELP (UNSPEC.)" };
const labelWord = (l) => (l == null ? "NOT RECORDED" : LABELS[l] || l);
const pct = (k, t) => (t ? ((k * 100) / t).toFixed(1) : "—");
const mkey = (v) => (v === 2 ? "v2" : "v1");

/* ------------------------------------------------------------ derived data */
function cellState(note, v, basis) {
  if (!note || note.missing) return "nodata";
  const b = note.pred.baseline, m = note.pred[mkey(v)];
  const k = basis === "joint" ? "joint_correct" : "label_correct";
  if (!b || !m || b[k] == null || m[k] == null) return "nodata";
  if (b[k] && m[k]) return "both";
  if (b[k]) return "base";
  if (m[k]) return "model";
  return "neither";
}
const correct = (note, sys, metric) => { const p = note.pred[sys]; return !!(p && p[metric + "_correct"]); };
function score(sys, metric) {
  const sm = SYS[sys] && SYS[sys].summary;
  const counted = NOTES.filter((n) => correct(n, sys, metric)).length;
  if (sm && sm[metric + "_correct"] != null) {
    if (sm[metric + "_correct"] !== counted) console.warn(`[divergence] ${sys} ${metric}: stored summary ${sm[metric + "_correct"]} ≠ per-note count ${counted}`);
    return { k: sm[metric + "_correct"], t: sm.total, src: "stored" };
  }
  return { k: counted, t: N, src: "derived" };
}
const resolved = (spans) => (spans || []).filter((x) => x.start != null);
const spanKey = (spans) => resolved(spans).map((x) => x.start + ":" + x.end).sort().join(",");
const moved = (n) => !!(n.pred.v1 && n.pred.v2 && n.text && spanKey(n.pred.v1.spans) !== spanKey(n.pred.v2.spans));
const labelChanged = (n) => !!(n.pred.v1 && n.pred.v2 && n.pred.v1.label !== n.pred.v2.label);
const STATS = {
  labelsChanged: NOTES.filter(labelChanged).length,
  spansMoved: NOTES.filter(moved).length,
  baselineChanged: D && D.provenance.baseline_replay_identical_in_followup === true ? 0 : null,
};

/* ------------------------------------------------------------------ stage */
let SCALE = 1;
function fit() {
  SCALE = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  const st = $("stage");
  st.style.transform = `scale(${SCALE})`;
  st.style.left = (window.innerWidth - 1920 * SCALE) / 2 + "px";
  st.style.top = (window.innerHeight - 1080 * SCALE) / 2 + "px";
}

/* ------------------------------------------------------------- animations */
let running = [];
let gen = 0;
function anim(elm, frames, opts) {
  if (REDUCED || !elm) return null;
  const a = elm.animate(frames, Object.assign({ fill: "backwards", easing: EASE }, opts));
  running.push(a);
  return a;
}
function stopAll() { running.forEach((a) => a.cancel()); running = []; }
function finishAll() { running.forEach((a) => { try { a.finish(); } catch (e) {} }); running = []; }

let charSpans = [];

}

/* A glowing puck travels a cubic bezier using transform keyframes only. */
function bez(p0, c1, c2, p1, t) {

function puck(layer, a, b, delay, dur, lift, vertical) {

  const c2 = vertical ? { x: b.x, y: Math.min(a.y, b.y) + lift } : { x: b.x + lift, y: b.y };
  const trail = s("path", { d: `M${a.x},${a.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${b.x},${b.y}`, fill: "none", stroke: "#4ea8ff", "stroke-width": 3, "stroke-dasharray": "6 6", opacity: 0.9 }, layer);
  const p = s("g", null, layer);

  s("circle", { cx: 0, cy: 0, r: 11, fill: "#4ea8ff", stroke: "#ffffff", "stroke-width": 3 }, p);
  p.style.opacity = "0";
  p.style.transform = `translate(${b.x}px, ${b.y}px)`;
  const frames = [];
  for (let i = 0; i <= 24; i++) {
    const q = bez(a, c1, c2, b, i / 24);
    frames.push({ offset: i / 24, transform: `translate(${q.x}px, ${q.y}px) scale(${1 + 0.5 * Math.sin((Math.PI * i) / 24)})`, opacity: i === 0 || i === 24 ? 0 : 1 });
  }
  anim(p, frames, { duration: dur, delay, easing: EASE_IO });
  anim(trail, [{ opacity: 0 }, { opacity: 0.9 }], { duration: dur * 0.6, delay });
}

/* layout "race" (Act II, prompt v1) or "swing" (Act III, prompt v). mode null | "race" | "swing". */
function renderBoard(layout, v, mode, P) {
  boardText(layout, v);
  const cols = $("gCols"), idx = $("gIdx"), rib = $("gRib"), arcs = $("gArcs");

  NOTES.forEach((_, i) => s("text", { x: colX(i) + cw() / 2, y: G.idxY, "text-anchor": "middle", "font-size": 22, "font-weight": 850, fill: i === ACT1 && layout === "race" ? "#ffd84d" : "#f6f4ef" }, idx, String(i + 1)));

    s("title", null, g, `Note ${i + 1} under prompt v${v === 2 ? 1 : 2}: ${STATES[o].word}`);
    ghostEls[i] = g;
  });
  const fly = $("flyNote"); fly.style.opacity = "0"; fly.textContent = "";

  if (layout === "race") {
    const refs = buildRace();
    if (mode !== "race") return;

    let flyEnd = 0;

      fly.textContent = n1.text; fly.style.fontSize = noteFont(Array.from(n1.text).length) + "px";

        { opacity: 0, transform: `translate(${tx}px, ${ty}px) scale(${cw() / 1720}, ${G.cellH / fh})` }], { duration: P.fly, easing: EASE_IN, fill: "none" });

      anim(colRefs[i].mb, [{ opacity: 0 }, { opacity: 1 }], { duration: P.arcDur * 0.3, delay: t0 + P.arcDur * 0.75 });
      const x = colX(i) + (3 * cw()) / 4;
      const a = { x, y: setMid(n, n.pred[mkey(from)].spans) }, b = { x, y: setMid(n, n.pred[mkey(v)].spans) };

  const evJ = NOTES.map((n, i) => [land[i], (correct(n, mkey(v), "joint") ? 1 : 0) - (correct(n, mkey(from), "joint") ? 1 : 0)]);

  driveOdo(refs.changed.od, valuePath(evC, 0, STATS.labelsChanged, P.swingTotal, "labels changed"), P.swingTotal);
}

/* ============================================================== VERDICT */
function factRows() {
  const p = D.provenance, rev = (p.dataset_revision || [])[0] || "unrecorded";
  const v2 = score("v2", "label"), base = score("baseline", "label");
  const ag = p.blind_label_agreement || {};
  const au = D.always_unclear_label_correct;
  const retried = (p.v2_retried_ids || []).length;
  const tie = au === base.k ? `the same as the baseline's ${base.k}/${base.t}` : `against the baseline's ${base.k}/${base.t}`;
  return [
    [`${N}`, `${N} notes.`, `One note moves a score by ${pct(1, N)} points. Some labels have only one or two examples.`],
    ["1 rev.", "Synthetic data, pinned to one revision.", `Public synthetic Fruta records at revision ${escapeHTML(rev.slice(0, 12))}, translated to English by a coding agent. Not real care notes.`],
    ["1", "Ground truth from a single labeller.", `Every label and span comes from one assistant model family: two coding agents labelled blind (${ag.agreed ?? "?"}/${ag.total ?? "?"} agreement), an agent adjudicated. No human or clinical expert reviewed them.`],
    ["post-hoc", "v2 is post-hoc.", `Prompt v2 was written after reading the v1 errors on these same notes. Its ${pct(v2.k, v2.t)}% is a post-hoc replay on the same held-out set, not a held-out estimate. ${retried} of its ${v2.t} answers came from a retry after rate limits.`],
    [`${au}/${N}`, "The trivial answer ties.", `Answering UNCLEAR for every note scores ${au}/${N} on labels — ${tie}.`],
  ];
}
function limitsHTML() {
  return `<h2>The case against this result</h2><div class="lede">This visual argues against its own author. Read every number on it through these five facts.</div><ol>` +
    factRows().map(([, a, b]) => `<li><b>${a}</b><span>${b}</span></li>`).join("") + `</ol>`;
}
function renderVerdict(P, animate) {
  const W = $("vWrap");
  W.innerHTML = `<h2>The case against this result</h2><div class="lede">This visual argues against its own author.</div>` +
    factRows().map(([big, a, b]) => `<div class="vline"><div class="big">${big}</div><div class="txt"><b>${a}</b> ${b}</div></div>`).join("") +
    `<div id="vEnd">What would settle it: a new, uninspected sample, reviewed by humans.</div>`;
  if (!animate) return;
  const items = [W.querySelector("h2"), W.querySelector(".lede"), ...W.querySelectorAll(".vline"), $("vEnd")];
  items.forEach((el, i) => anim(el, [{ opacity: 0, transform: "translateX(-80px)" }, { opacity: 1, transform: "none" }], { duration: P.verdict * 0.25, delay: (i * P.verdict * 0.75) / items.length, easing: EASE_POP }));
}
function keysHTML() {
  const k = [["space · →", "next (first press completes a running animation)"], ["←", "back — lands instantly"],
    ["1–9 · 0", "jump to note 1–10 · two quick digits reach 11–24"], ["→ · ← in a note", "next / previous note · Esc or d returns to the ribbon"],
    ["a", "autoplay, full-length timings"], ["Shift+3", "3-minute preset autoplay"],
    ["v", "toggle prompt v1 / v2 — v2 is a post-hoc replay"], ["d", "ribbon view · again on the ribbon: label ⇄ joint basis"],
    ["l", "limitations"], ["s", "save the current frame as PNG (settled state)"], ["r", "reset"], ["?", "this legend"]];
  return `<h2>Keys</h2><div class="keys">${k.map(([a, b]) => `<div class="k">${a}</div><div>${b}</div>`).join("")}</div>
  <div style="margin-top:22px;font-size:23px;color:var(--ink2)">Ribbon words: BOTH RIGHT · BASELINE ONLY (rises) · MODEL ONLY (drops) · NEITHER RIGHT (hatched) · NO DATA (dashed).</div>`;
}

/* ================================================================== STATE */
const STEPS = ["title", "demo", "note", "race", "swing", "verdict"];
const S = { mode: "seq", step: 0, note: ACT1, v: 1, basis: "label", profile: "standard", autoplay: false, digit: null, digitTimer: null, autoTimer: null };
const P = () => PROFILES[S.profile];
function show(id) { ["titleScene", "demoScene", "noteScene", "boardScene", "verdictScene"].forEach((x) => $(x).classList.toggle("on", x === id)); }

function enter(step, animate, swingFrom) {
  stopAll(); gen++;
  S.mode = "seq"; S.step = step;
  const g = gen, Pr = P();
  const name = STEPS[step];
  if (name === "note" && DEGRADED) return enter(step + 1, animate);
  if (name === "title") { show("titleScene"); renderTitle(Pr, animate); }
  else if (name === "demo") { show("demoScene"); renderDemo(Pr, animate); }
  else if (name === "note") { show("noteScene"); S.note = ACT1; S.v = 1; renderNote(ACT1, 1, animate ? "type" : null, Pr); }
  else if (name === "race") { S.v = 1; show("boardScene"); renderBoard("race", 1, animate ? "race" : null, Pr); }
  else if (name === "swing") { S.v = swingFrom === 2 ? 1 : 2; show("boardScene"); renderBoard("swing", S.v, animate ? "swing" : null, Pr); }
  else { show("verdictScene"); renderVerdict(Pr, animate); }
  if (animate && running.length) console.log(`[divergence] ${["Title", "Demo", "Act I", "Act II", "Act III", "Verdict"][step]}${swingFrom === 2 ? " (reverse swing)" : ""} · ${Pr.name} · measured from animation timeline: ${(motionEnd() / 1000).toFixed(2)} s`);
  // title flows into the demo on its own; elsewhere autoplay advances
  if (animate && (S.autoplay || name === "title")) {
    motionDone().then(() => {
      if (g !== gen || (!S.autoplay && name !== "title")) return;
      if (S.step >= STEPS.length - 1) { S.autoplay = false; toast("Autoplay finished"); return; }
      S.autoTimer = setTimeout(() => { if (g === gen) enter(S.step + 1, true); }, REDUCED ? 1500 : Pr.holds[S.step]);
    });
  }
}
function inspect(i) {
  stopAll(); gen++; stopAuto();
  if (i < 0 || i >= N) { toast(`No note ${i + 1} — ${N} notes present`); return; }
  S.mode = "inspect"; S.note = i;
  show("noteScene"); renderNote(i, S.v, null, P());
}
function stopAuto() { S.autoplay = false; clearTimeout(S.autoTimer); }
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.opacity = "1";
  clearTimeout(toast.tm); toast.tm = setTimeout(() => (t.style.opacity = "0"), 1600);
}
const onBoard = () => S.mode === "seq" && (STEPS[S.step] === "race" || STEPS[S.step] === "swing");
function ribbonView() {
  stopAuto();
  if (onBoard()) {
    S.basis = S.basis === "label" ? "joint" : "label"; stopAll();
    renderBoard(STEPS[S.step], S.v, null, P()); toast(`Ribbon basis: ${S.basis}`);
  } else enter(S.v === 2 ? 4 : 3, false);
}
function next() {
  if (busy()) { gen++; stopAuto(); finishAll(); return; }
  stopAuto();
  if (S.mode === "inspect") return inspect(Math.min(N - 1, S.note + 1));
  if (S.step >= STEPS.length - 1) return;
  enter(S.step + 1, true);
}
function back() {
  stopAuto();
  if (S.mode === "inspect") return inspect(Math.max(0, S.note - 1));
  let st = Math.max(0, S.step - 1);
  if (STEPS[st] === "note" && DEGRADED) st -= 1;
  enter(Math.max(0, st), false);
}
function toggleV() {
  stopAuto();
  if (S.mode === "seq" && STEPS[S.step] === "race") { enter(4, true); return; }
  if (S.mode === "seq" && STEPS[S.step] === "swing") {
    stopAll(); gen++;
    const target = S.v === 2 ? 1 : 2; S.v = target;
    renderBoard("swing", target, "swing", P());
    return;
  }
  S.v = S.v === 2 ? 1 : 2;
  if (S.mode === "inspect" || STEPS[S.step] === "note") { stopAll(); renderNote(S.note, S.v, "swing", P()); }
  toast(S.v === 2 ? "Prompt v2 — post-hoc replay on the same held-out set" : "Prompt v1 — held-out run");
}
function reset(profile, auto) {
  stopAuto(); stopAll();
  Object.assign(S, { v: 1, basis: "label", profile: profile || "standard", autoplay: !!auto });
  $("ovKeys").classList.remove("on"); $("ovLimits").classList.remove("on");
  enter(0, true);
}
function digit(d) {
  clearTimeout(S.digitTimer);
  if (S.digit != null) {
    const n = S.digit * 10 + d; S.digit = null;
    if (n >= 11 && n <= N) return inspect(n - 1);
  }
  inspect((d === 0 ? 10 : d) - 1);
  if ((d === 1 || d === 2) && N > 10) { S.digit = d; S.digitTimer = setTimeout(() => (S.digit = null), 900); }
}

/* ------------------------------------------------------------- PNG export */
function exportPNG() {
  const clone = $("stage").cloneNode(true);
  clone.style.transform = "none"; clone.style.left = "0px"; clone.style.top = "0px";
  clone.querySelector("#toast").style.opacity = "0";
  const css = document.querySelector("style").textContent.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const body = new XMLSerializer().serializeToString(clone);
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><foreignObject x="0" y="0" width="1920" height="1080">` +
    `<div xmlns="http://www.w3.org/1999/xhtml" style="width:1920px;height:1080px;position:relative"><style>${css}</style>${body}</div></foreignObject></svg>`;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = 1920; c.height = 1080;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#07090d"; ctx.fillRect(0, 0, 1920, 1080); ctx.drawImage(img, 0, 0);
    c.toBlob((blob) => {
      if (!blob) { toast("PNG export failed"); return; }
      const a = document.createElement("a");
      const where = S.mode === "inspect" ? `note-${S.note + 1}` : STEPS[S.step];
      a.download = `divergence-${where}-v${S.v}-${S.basis}.png`;
      a.href = URL.createObjectURL(blob); document.body.appendChild(a); a.click(); a.remove();
      toast("Saved " + a.download);
    }, "image/png");
  };
  img.onerror = () => toast("PNG export failed");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);
}

/* ------------------------------------------------------------------- keys */
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === "Digit3" && e.shiftKey) { e.preventDefault(); reset("preset3", true); toast("3-minute preset · autoplay"); return; }
  const k = e.key;
  if (k === " " || k === "ArrowRight") { e.preventDefault(); next(); }
  else if (k === "ArrowLeft") { e.preventDefault(); back(); }
  else if (/^[0-9]$/.test(k)) digit(Number(k));
  else if (k === "a") {
    if (S.autoplay) { stopAuto(); toast("Autoplay off"); return; }
    if (S.mode !== "seq" || S.step >= STEPS.length - 1) reset("standard", true);
    else { S.profile = "standard"; S.autoplay = true; enter(S.step, true); }
    toast("Autoplay · full-length");
  }
  else if (k === "v") toggleV();
  else if (k === "d") ribbonView();
  else if (k === "Escape") { if ($("ovKeys").classList.contains("on") || $("ovLimits").classList.contains("on")) { $("ovKeys").classList.remove("on"); $("ovLimits").classList.remove("on"); } else if (S.mode === "inspect") ribbonView(); }
  else if (k === "l") { $("limitsPanel").innerHTML = limitsHTML(); $("ovKeys").classList.remove("on"); $("ovLimits").classList.toggle("on"); }
  else if (k === "?" || k === "/") { $("keysPanel").innerHTML = keysHTML(); $("ovLimits").classList.remove("on"); $("ovKeys").classList.toggle("on"); }
  else if (k === "s") exportPNG();
  else if (k === "r") reset("standard", false);
});
window.addEventListener("resize", () => { fit(); if (!busy() && (S.mode === "inspect" || STEPS[S.step] === "note")) renderNote(S.note, S.v, null, P()); });

/* ------------------------------------------------------------------- boot */
function logTimings() {
  const note = NOTES[ACT1];
  const rows = Object.values(PROFILES).map((Pr) => {
    const t = DEGRADED ? { T: 0, total: 0 } : actOneTiming(Pr, note);
    const segs = [Pr.title, Pr.demo, t.total, Pr.ribbonTotal, Pr.swingTotal, Pr.verdict];
    const motion = segs.reduce((a, b) => a + b, 0), holds = Pr.holds.reduce((a, b) => a + b, 0);
    return { profile: Pr.name, title: segs[0], demo: segs[1], actI: segs[2], typing: t.T, actII: segs[3], actIII: segs[4], verdict: segs[5], motion, holds, total: motion + holds };
  });
  const f = (ms) => (ms / 1000).toFixed(2) + " s";
  console.log(`[divergence] Durations from the schedule the animations use (Act I note ${note ? note.id : "none"})${REDUCED ? " — prefers-reduced-motion ON: motion cut to end states" : ""}`);
  rows.forEach((r) => console.log(`[divergence] ${r.profile}: title ${f(r.title)} · demo ${f(r.demo)} · Act I ${f(r.actI)} (typing ${f(r.typing)}) · Act II ${f(r.actII)} · Act III ${f(r.actIII)} · verdict ${f(r.verdict)} · motion ${f(r.motion)} · holds ${f(r.holds)} · autoplay end-to-end ${f(r.total)}`));
}
fit();
if (!D) {
  document.body.innerHTML = '<p style="font:28px system-ui;color:#fff;padding:60px">No data inlined. Run <code>python scripts/export_divergence.py</code>.</p>';
} else {
  $("fSrc").innerHTML = `saved results only · freeze <b>${escapeHTML(String(D.provenance.freeze_commit || "").slice(0, 7))}</b> · no model calls`;
  logTimings();
  enter(0, true);
}
</script>
</body>
</html>
