<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#f7faf9;color:#163d3a;font-family:Arial,sans-serif;padding:52px}.tag{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#176c63;font-weight:bold}h1{font-size:54px;letter-spacing:-2px;margin:12px 0}h2{font-size:21px;margin:0 0 8px}p{font-size:18px;line-height:1.45;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}figure{margin:0;border:1px solid #c8dad6;background:white;border-radius:14px;padding:22px}img{display:block;max-width:100%;width:100%;height:360px;object-fit:contain;background:#f7faf9;border-radius:6px}figcaption{padding-top:15px}figcaption p{font-size:16px;color:#52706a;min-height:47px}.footer{font-size:15px;margin-top:25px;padding-top:18px;border-top:1px solid #c8dad6;color:#52706a}</style></head><body><div class="tag">Actual app UI · fictional fixture walkthrough</div><h1>CareSignal</h1><p>One note. A resident-specific comparison. Exact source evidence. A correction you can trace.</p><div class="grid"><figure><img src="assets/screenshots/01-elena-more-help.png"><figcaption><h2>Elena: more help than usual</h2><p>Documented staff supervision is compared with Elena’s confirmed independent breakfast routine.</p></figcaption></figure><figure><img src="assets/screenshots/02-ruth-matches.png"><figcaption><h2>Ruth: matches usual routine</h2><p>The same note matches Ruth’s confirmed supervision baseline. The baseline changes the comparison.</p></figcaption></figure><figure><img src="assets/screenshots/03-evidence-detail.png"><figcaption><h2>Exact evidence, two separate sources</h2><p>The highlighted quote comes from the active note. The usual-assistance description and confirmation date stay separate.</p></figcaption></figure><figure><img src="assets/screenshots/05-correction-history.png"><figcaption><h2>New source, preserved history</h2><p>The walker-only replacement leaves human help unspecified. Version 2 is Active; version 1 stays Corrected in history.</p></figcaption></figure></div><div class="footer">This project is a prototype and is not medical advice. · Full-resolution images, storyboard and prompt are included in the kit.</div></body></html>
